<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Style Platformer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Mencegah gesture scroll dan seleksi di HP */
        body, html {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #0f172a;
        }
        canvas {
            image-rendering: pixelated;
        }
        .touch-btn {
            touch-action: none;
        }
        .touch-btn:active {
            transform: scale(0.92);
            filter: brightness(0.85);
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between items-center select-none p-2 md:p-4">

    <!-- Header Status & Skor -->
    <header class="w-full max-w-4xl flex justify-between items-center bg-slate-800/80 backdrop-blur border border-slate-700 px-4 py-2 rounded-xl shadow-lg mb-2 z-10">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2">
                <span class="text-xl md:text-2xl">🍄</span>
                <span id="scoreText" class="font-bold text-yellow-400 text-lg md:text-xl">SKOR: 0</span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xl md:text-2xl">🪙</span>
                <span id="coinsText" class="font-bold text-yellow-300 text-lg md:text-xl">KOIN: 0</span>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-1">
                <span class="text-xl md:text-2xl">❤️</span>
                <span id="livesText" class="font-bold text-red-400 text-lg md:text-xl">x 3</span>
            </div>
            <button id="audioToggle" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-lg text-sm transition">
                🔊 Suara
            </button>
        </div>
    </header>

    <!-- Pembungkus Canvas Game -->
    <main class="relative w-full max-w-4xl flex-1 flex justify-center items-center overflow-hidden rounded-2xl border-2 border-slate-700 bg-sky-400 shadow-2xl">
        <canvas id="gameCanvas" width="800" height="450" class="w-full h-auto max-h-[70vh] object-contain block"></canvas>

        <!-- UI Layar Game Over / Menang / Start -->
        <div id="overlayScreen" class="absolute inset-0 bg-black/75 backdrop-blur-sm flex flex-col justify-center items-center text-center p-6 transition-all duration-300">
            <h1 id="overlayTitle" class="text-4xl md:text-6xl font-extrabold text-yellow-400 mb-4 drop-shadow-md">
                SUPER PETUALANGAN
            </h1>
            <p id="overlaySubtitle" class="text-slate-200 text-base md:text-lg mb-6 max-w-md">
                Gunakan panah keyboard (Atas/Kiri/Kanan) atau tombol sentuh di bawah untuk bergerak, melompat, dan mencapai bendera!
            </p>
            <button id="startBtn" class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-black text-xl px-8 py-4 rounded-2xl shadow-lg hover:shadow-green-500/50 transform transition active:scale-95">
                Mulai Bermain ▶
            </button>
        </div>
    </main>

    <!-- Kontrol Tombol Layar Sentuh untuk HP/Mobile -->
    <footer class="w-full max-w-4xl mt-2 flex justify-between items-center px-2 md:px-6 py-1 select-none">
        <!-- Tombol Arah (Kiri / Kanan) -->
        <div class="flex space-x-3">
            <button id="btnLeft" class="touch-btn w-16 h-16 md:w-20 md:h-20 bg-slate-800/90 border-2 border-slate-600 text-white text-3xl font-bold rounded-2xl shadow-xl flex justify-center items-center active:bg-blue-600">
                ◄
            </button>
            <button id="btnRight" class="touch-btn w-16 h-16 md:w-20 md:h-20 bg-slate-800/90 border-2 border-slate-600 text-white text-3xl font-bold rounded-2xl shadow-xl flex justify-center items-center active:bg-blue-600">
                ►
            </button>
        </div>

        <!-- Tombol Melompat -->
        <div>
            <button id="btnJump" class="touch-btn w-20 h-20 md:w-24 md:h-24 bg-red-600/90 border-2 border-red-400 text-white text-xl md:text-2xl font-black rounded-full shadow-2xl flex justify-center items-center active:bg-red-700 uppercase tracking-wider">
                LOMPAT
            </button>
        </div>
    </footer>

    <!-- Logika Game JavaScript -->
    <script>
        // Setup Canvas & Context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Elemen UI
        const scoreText = document.getElementById('scoreText');
        const coinsText = document.getElementById('coinsText');
        const livesText = document.getElementById('livesText');
        const overlayScreen = document.getElementById('overlayScreen');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const startBtn = document.getElementById('startBtn');
        const audioToggle = document.getElementById('audioToggle');

        // Sistem Efek Suara (Web Audio API)
        let soundEnabled = true;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(987.77, now); // Note B5
                    osc.frequency.setValueAtTime(1318.51, now + 0.08); // Note E6
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'stomp') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'block') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(110, now + 0.05);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.5);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'win') {
                    const notes = [261.63, 329.63, 392.00, 523.25];
                    notes.forEach((freq, idx) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.type = 'triangle';
                        noteOsc.frequency.value = freq;
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        const start = now + idx * 0.12;
                        noteGain.gain.setValueAtTime(0.2, start);
                        noteGain.gain.linearRampToValueAtTime(0.01, start + 0.2);
                        noteOsc.start(start);
                        noteOsc.stop(start + 0.2);
                    });
                }
            } catch(e) { console.error(e); }
        }

        audioToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            audioToggle.innerText = soundEnabled ? '🔊 Suara' : '🔇 Mute';
        });

        // Kontrol Input Keyboard & Touch
        const keys = {
            left: false,
            right: false,
            jump: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
                if (!keys.jump && player.grounded) {
                    player.vy = -player.jumpStrength;
                    player.grounded = false;
                    playSound('jump');
                }
                keys.jump = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.jump = false;
        });

        // Event Listener Tombol Sentuh Mobile
        const bindTouch = (id, keyName) => {
            const btn = document.getElementById(id);
            const start = (e) => {
                e.preventDefault();
                initAudio();
                if (keyName === 'jump') {
                    if (!keys.jump && player.grounded) {
                        player.vy = -player.jumpStrength;
                        player.grounded = false;
                        playSound('jump');
                    }
                }
                keys[keyName] = true;
            };
            const end = (e) => {
                e.preventDefault();
                keys[keyName] = false;
            };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        };

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnJump', 'jump');

        // Parameter & Elemen Game
        const GRAVITY = 0.55;
        let cameraX = 0;
        let gameScore = 0;
        let coinsCollected = 0;
        let lives = 3;
        let isGameStateRunning = false;

        // Player (Karakter Utama)
        const player = {
            x: 80,
            y: 200,
            width: 32,
            height: 40,
            vx: 0,
            vy: 0,
            speed: 4.5,
            jumpStrength: 12.5,
            grounded: false,
            facingLeft: false,
            animFrame: 0,
            animTimer: 0
        };

        // Platform & Blok Level
        let platforms = [];
        let coins = [];
        let enemies = [];
        let particles = [];
        let flag = { x: 2600, y: 150, width: 20, height: 210, reached: false };

        // Desain Peta / Level Generation
        function buildLevel() {
            platforms = [];
            coins = [];
            enemies = [];
            particles = [];

            // Tanah Dasar (dengan celah-celah jurang)
            const groundSegments = [
                { start: 0, width: 800 },
                { start: 920, width: 600 },
                { start: 1600, width: 500 },
                { start: 2180, width: 700 }
            ];

            groundSegments.forEach(seg => {
                platforms.push({ x: seg.start, y: 360, width: seg.width, height: 90, type: 'ground' });
            });

            // Blok Melayang (Bricks & Question Blocks)
            const blockData = [
                // Area Awal
                { x: 250, y: 260, type: 'question', item: 'coin' },
                { x: 290, y: 260, type: 'brick' },
                { x: 330, y: 260, type: 'question', item: 'coin' },
                { x: 370, y: 260, type: 'brick' },
                { x: 330, y: 160, type: 'question', item: 'coin' },

                // Pipa & Struktur Tinggi
                { x: 520, y: 300, width: 50, height: 60, type: 'pipe' },
                { x: 680, y: 270, width: 50, height: 90, type: 'pipe' },

                // Area Tengah (Melompati Jurang)
                { x: 960, y: 260, type: 'brick' },
                { x: 1000, y: 260, type: 'question', item: 'coin' },
                { x: 1040, y: 260, type: 'brick' },
                { x: 1150, y: 200, type: 'brick' },
                { x: 1190, y: 200, type: 'question', item: 'coin' },
                { x: 1230, y: 200, type: 'brick' },

                { x: 1380, y: 280, width: 40, height: 80, type: 'pipe' },

                // Platform Melayang di Atas Jurang Kedua
                { x: 1520, y: 280, width: 70, height: 20, type: 'platform' },
                { x: 1660, y: 220, width: 80, height: 20, type: 'platform' },
                { x: 1800, y: 260, type: 'question', item: 'coin' },
                { x: 1840, y: 260, type: 'question', item: 'coin' },

                // Tangga Akhir Menuju Bendera
                { x: 2300, y: 320, width: 40, height: 40, type: 'brick' },
                { x: 2340, y: 280, width: 40, height: 80, type: 'brick' },
                { x: 2380, y: 240, width: 40, height: 120, type: 'brick' },
                { x: 2420, y: 200, width: 40, height: 160, type: 'brick' }
            ];

            blockData.forEach(b => {
                platforms.push({
                    x: b.x,
                    y: b.y,
                    width: b.width || 40,
                    height: b.height || 40,
                    type: b.type,
                    item: b.item,
                    hit: false
                });
            });

            // Koin Bebas Melayang
            const coinPositions = [
                { x: 250, y: 220 }, { x: 290, y: 220 }, { x: 370, y: 220 },
                { x: 535, y: 260 }, { x: 695, y: 230 },
                { x: 1540, y: 240 }, { x: 1680, y: 180 },
                { x: 2000, y: 320 }, { x: 2040, y: 320 }, { x: 2080, y: 320 }
            ];

            coinPositions.forEach(c => {
                coins.push({ x: c.x, y: c.y, width: 18, height: 22, collected: false });
            });

            // Musuh (Goomba Bergaya Cokelat)
            enemies = [
                { x: 450, y: 330, width: 30, height: 30, vx: -1.2, alive: true },
                { x: 800, y: 330, width: 30, height: 30, vx: -1.2, alive: true },
                { x: 1100, y: 330, width: 30, height: 30, vx: 1.2, alive: true },
                { x: 1720, y: 330, width: 30, height: 30, vx: -1.5, alive: true },
                { x: 2100, y: 330, width: 30, height: 30, vx: -1.5, alive: true }
            ];

            flag.reached = false;
        }

        function resetPlayer() {
            player.x = 80;
            player.y = 200;
            player.vx = 0;
            player.vy = 0;
            player.grounded = false;
        }

        // Efek Partikel Pecahan / Sinar
        function addParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    size: Math.random() * 5 + 3,
                    color: color,
                    life: 25
                });
            }
        }

        // Pembaruan Logika Game
        function update() {
            if (!isGameStateRunning) return;

            // Pergerakan Player
            if (keys.left) {
                player.vx = -player.speed;
                player.facingLeft = true;
            } else if (keys.right) {
                player.vx = player.speed;
                player.facingLeft = false;
            } else {
                player.vx *= 0.75; // Gesekan (Friction)
            }

            // Gravitasi
            player.vy += GRAVITY;

            // Asumsi grounded sebelum kalkulasi tabrakan
            player.grounded = false;

            // Gerak Horizontal & Tabrakan
            player.x += player.vx;
            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vx > 0) player.x = p.x - player.width;
                    else if (player.vx < 0) player.x = p.x + p.width;
                }
            }

            // Gerak Vertikal & Tabrakan
            player.y += player.vy;
            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vy > 0) { // Jatuh menapak di atas platform
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    } else if (player.vy < 0) { // Sundulan dari bawah
                        player.y = p.y + p.height;
                        player.vy = 0;

                        // Efek jika membentur Question Block atau Brick
                        if (p.type === 'question' && !p.hit) {
                            p.hit = true;
                            coinsCollected++;
                            gameScore += 200;
                            playSound('coin');
                            addParticles(p.x + p.width / 2, p.y, '#facc15');
                        } else if (p.type === 'brick') {
                            playSound('block');
                            addParticles(p.x + p.width / 2, p.y + p.height / 2, '#b45309', 10);
                        }
                    }
                }
            }

            // Batas Kiri Peta
            if (player.x < 0) player.x = 0;

            // Kamera Mengikuti Karakter
            cameraX = player.x - 250;
            if (cameraX < 0) cameraX = 0;

            // Cek Jatuh ke Jurang
            if (player.y > canvas.height + 100) {
                handlePlayerDeath();
            }

            // Logika Koin
            coins.forEach(c => {
                if (!c.collected && checkCollision(player, c)) {
                    c.collected = true;
                    coinsCollected++;
                    gameScore += 100;
                    playSound('coin');
                    addParticles(c.x + 10, c.y + 10, '#fde047', 6);
                }
            });

            // Logika Musuh
            enemies.forEach(e => {
                if (!e.alive) return;

                // Gerak Musuh
                e.x += e.vx;

                // Membalik arah jika menabrak platform atau jurang
                platforms.forEach(p => {
                    if (checkCollision(e, p)) {
                        e.vx *= -1;
                        e.x += e.vx;
                    }
                });

                // Tabrakan Karakter dengan Musuh
                if (checkCollision(player, e)) {
                    // Lompat di atas kepala musuh (Stomp)
                    if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 12) {
                        e.alive = false;
                        player.vy = -8; // Memantul ke atas
                        gameScore += 300;
                        playSound('stomp');
                        addParticles(e.x + e.width / 2, e.y + e.height / 2, '#78350f', 8);
                    } else {
                        // Tersentuh dari samping/bawah -> Kalah / Kurang nyawa
                        handlePlayerDeath();
                    }
                }
            });

            // Logika Mencapai Bendera (Kemenangan)
            if (!flag.reached && checkCollision(player, flag)) {
                flag.reached = true;
                gameScore += 1000 + lives * 500;
                playSound('win');
                setTimeout(() => {
                    endGame(true);
                }, 800);
            }

            // Update Partikel
            particles.forEach((part, index) => {
                part.x += part.vx;
                part.y += part.vy;
                part.life--;
                if (part.life <= 0) particles.splice(index, 1);
            });

            // Animasi Berlari
            if (Math.abs(player.vx) > 0.5) {
                player.animTimer++;
                if (player.animTimer % 6 === 0) {
                    player.animFrame = (player.animFrame + 1) % 3;
                }
            } else {
                player.animFrame = 0;
            }

            // Update UI Header
            scoreText.innerText = `SKOR: ${gameScore}`;
            coinsText.innerText = `KOIN: ${coinsCollected}`;
            livesText.innerText = `x ${lives}`;
        }

        // Penanganan Player Mati
        function handlePlayerDeath() {
            lives--;
            playSound('gameover');
            if (lives <= 0) {
                endGame(false);
            } else {
                resetPlayer();
            }
        }

        // Fungsi Deteksi Tabrakan Kotak (AABB)
        function checkCollision(r1, r2) {
            return (
                r1.x < r2.x + r2.width &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.height &&
                r1.y + r1.height > r2.y
            );
        }

        // Rendering / Menggambar Visual Game
        function render() {
            // Clear & Latar Belakang Langit
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#38bdf8'; // Sky Blue
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-Math.floor(cameraX), 0);

            // Awan Dekoratif di Langit
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            const cloudPositions = [100, 400, 750, 1100, 1500, 1900, 2300];
            cloudPositions.forEach(cx => {
                ctx.beginPath();
                ctx.arc(cx, 80, 25, 0, Math.PI * 2);
                ctx.arc(cx + 20, 70, 30, 0, Math.PI * 2);
                ctx.arc(cx + 45, 80, 22, 0, Math.PI * 2);
                ctx.fill();
            });

            // Bukit-bukit Latar Belakang
            ctx.fillStyle = '#16a34a';
            const hillPositions = [200, 850, 1450, 2100];
            hillPositions.forEach(hx => {
                ctx.beginPath();
                ctx.arc(hx, 360, 90, Math.PI, 0);
                ctx.fill();
            });

            // Platform & Blok
            platforms.forEach(p => {
                if (p.type === 'ground') {
                    // Rumput Hijau Atas
                    ctx.fillStyle = '#22c55e';
                    ctx.fillRect(p.x, p.y, p.width, 16);
                    // Tanah Cokelat
                    ctx.fillStyle = '#854d0e';
                    ctx.fillRect(p.x, p.y + 16, p.width, p.height - 16);
                } else if (p.type === 'brick') {
                    ctx.fillStyle = '#b45309';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = '#78350f';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                } else if (p.type === 'question') {
                    ctx.fillStyle = p.hit ? '#92400e' : '#eab308';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = '#854d0e';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, p.y, p.width, p.height);

                    if (!p.hit) {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 22px sans-serif';
                        ctx.fillText('?', p.x + 14, p.y + 28);
                    }
                } else if (p.type === 'pipe') {
                    // Pipa Hijau khas Mario
                    ctx.fillStyle = '#15803d';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#22c55e';
                    ctx.fillRect(p.x - 4, p.y, p.width + 8, 20);
                    ctx.strokeStyle = '#14532d';
                    ctx.strokeRect(p.x - 4, p.y, p.width + 8, 20);
                } else if (p.type === 'platform') {
                    ctx.fillStyle = '#f97316';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                }
            });

            // Tiang & Bendera Finish
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(flag.x + 8, flag.y, 6, flag.height);
            ctx.fillStyle = '#ef4444'; // Bendera Merah
            ctx.beginPath();
            ctx.moveTo(flag.x + 14, flag.y);
            ctx.lineTo(flag.x + 60, flag.y + 25);
            ctx.lineTo(flag.x + 14, flag.y + 50);
            ctx.closePath();
            ctx.fill();

            // Koin Emas
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.ellipse(c.x + c.width / 2, c.y + c.height / 2, c.width / 2, c.height / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ca8a04';
                    ctx.stroke();
                }
            });

            // Musuh (Goomba)
            enemies.forEach(e => {
                if (e.alive) {
                    ctx.fillStyle = '#78350f'; // Tubuh Cokelat
                    ctx.beginPath();
                    ctx.arc(e.x + 15, e.y + 15, 15, Math.PI, 0, false);
                    ctx.fillRect(e.x, e.y + 15, 30, 12);
                    ctx.fill();

                    // Mata Musuh
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(e.x + 5, e.y + 12, 6, 8);
                    ctx.fillRect(e.x + 19, e.y + 12, 6, 8);
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(e.x + 7, e.y + 15, 3, 4);
                    ctx.fillRect(e.x + 19, e.y + 15, 3, 4);
                }
            });

            // Karakter Utama (Pahlawan Bergaya Mario)
            ctx.save();
            if (player.facingLeft) {
                ctx.translate(player.x + player.width, player.y);
                ctx.scale(-1, 1);
            } else {
                ctx.translate(player.x, player.y);
            }

            // Topi Merah
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(4, 0, 24, 8);
            ctx.fillRect(8, 0, 22, 10);

            // Wajah & Kulit
            ctx.fillStyle = '#fde047';
            ctx.fillRect(8, 8, 18, 12);

            // Baju Merah
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(6, 20, 20, 10);

            // Celana Kodok / Overalls Biru
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(8, 26, 16, 12);

            // Sepatu Cokelat
            ctx.fillStyle = '#451a03';
            if (player.grounded && Math.abs(player.vx) > 0.5) {
                // Kakinya bergantian saat jalan
                if (player.animFrame === 1) {
                    ctx.fillRect(2, 36, 10, 6);
                    ctx.fillRect(16, 32, 10, 6);
                } else {
                    ctx.fillRect(4, 34, 10, 6);
                    ctx.fillRect(18, 36, 10, 6);
                }
            } else {
                ctx.fillRect(4, 36, 10, 6);
                ctx.fillRect(18, 36, 10, 6);
            }

            ctx.restore();

            // Partikel Visual
            particles.forEach(part => {
                ctx.fillStyle = part.color;
                ctx.fillRect(part.x, part.y, part.size, part.size);
            });

            ctx.restore();
        }

        // Game Loop Utama (60 FPS)
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Memulai & Mengakhiri Permainan
        function startGame() {
            initAudio();
            lives = 3;
            gameScore = 0;
            coinsCollected = 0;
            buildLevel();
            resetPlayer();
            isGameStateRunning = true;
            overlayScreen.classList.add('hidden');
        }

        function endGame(isWin) {
            isGameStateRunning = false;
            overlayScreen.classList.remove('hidden');
            if (isWin) {
                overlayTitle.innerText = "SELAMAT! KAMU MENANG! 🎉";
                overlaySubtitle.innerText = `Kamu berhasil menyelesaikan level dengan skor ${gameScore} & mengumpulkan ${coinsCollected} koin!`;
                startBtn.innerText = "Main Lagi ↺";
            } else {
                overlayTitle.innerText = "GAME OVER 💀";
                overlaySubtitle.innerText = `Kamu kehabisan nyawa! Skor Akhir: ${gameScore}`;
                startBtn.innerText = "Coba Lagi ↺";
            }
        }

        startBtn.addEventListener('click', startGame);

        // Render Awal Sebelum Game Mulai
        buildLevel();
        render();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
