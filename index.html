<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario HD Platformer - Multi Stage</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Mencegah gesture scroll dan seleksi di HP */
        body, html {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #0b1329;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        .touch-btn {
            touch-action: none;
        }
        .touch-btn:active {
            transform: scale(0.92);
            filter: brightness(0.85);
        }
        .glow-box {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between items-center select-none p-2 md:p-4">

    <!-- Header Status & Skor HD -->
    <header class="w-full max-w-4xl flex justify-between items-center bg-slate-900/90 backdrop-blur-md border border-slate-700/80 px-4 md:px-5 py-2.5 rounded-2xl shadow-2xl mb-2 z-10 glow-box">
        <div class="flex items-center space-x-3 md:space-x-5">
            <div class="flex items-center space-x-1.5">
                <span class="text-xl md:text-2xl filter drop-shadow">🗺️</span>
                <span id="stageText" class="font-extrabold text-cyan-300 text-sm md:text-xl tracking-wide">STAGE: 1/3</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="text-xl md:text-2xl filter drop-shadow">🍄</span>
                <span id="scoreText" class="font-extrabold text-yellow-400 text-sm md:text-xl tracking-wide">SKOR: 0</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="text-xl md:text-2xl filter drop-shadow">🪙</span>
                <span id="coinsText" class="font-extrabold text-amber-300 text-sm md:text-xl tracking-wide">KOIN: 0</span>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-1">
                <span class="text-xl md:text-2xl filter drop-shadow">❤️</span>
                <span id="livesText" class="font-extrabold text-red-400 text-sm md:text-xl tracking-wide">x 3</span>
            </div>
            <button id="audioToggle" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-2.5 py-1 md:px-3 md:py-1.5 rounded-xl text-xs md:text-sm font-semibold transition flex items-center gap-1 shadow">
                🔊 Suara
            </button>
        </div>
    </header>

    <!-- Pembungkus Canvas Game -->
    <main class="relative w-full max-w-4xl flex-1 flex justify-center items-center overflow-hidden rounded-3xl border-2 border-slate-700/60 bg-slate-900 shadow-2xl glow-box">
        <canvas id="gameCanvas" width="800" height="450" class="w-full h-auto max-h-[72vh] object-contain block"></canvas>

        <!-- UI Layar Game Over / Menang / Start / Next Stage HD -->
        <div id="overlayScreen" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col justify-center items-center text-center p-6 transition-all duration-300">
            <div class="bg-slate-900/90 border border-slate-700 p-6 md:p-8 rounded-3xl max-w-lg shadow-2xl flex flex-col items-center">
                <div id="overlayIcon" class="text-5xl mb-2">⭐</div>
                <h1 id="overlayTitle" class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 mb-3 drop-shadow-lg tracking-wider">
                    SUPER MARIO HD
                </h1>
                <p id="overlaySubtitle" class="text-slate-300 text-sm md:text-base mb-6 leading-relaxed">
                    Jelajahi 3 Stage dunia HD! Gunakan keyboard (<span class="text-yellow-400 font-semibold">Panah / WASD</span>) atau tombol sentuh untuk berlari, melompat, dan mengumpulkan koin!
                </p>
                <button id="startBtn" class="bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-black text-lg md:text-xl px-8 py-3.5 md:px-10 md:py-4 rounded-2xl shadow-xl shadow-green-600/30 transform transition active:scale-95 border border-green-400/40 tracking-wider">
                    MULAI BERMAIN ▶
                </button>
            </div>
        </div>
    </main>

    <!-- Kontrol Tombol Layar Sentuh Mobile HD -->
    <footer class="w-full max-w-4xl mt-2 flex justify-between items-center px-2 md:px-6 py-1 select-none">
        <!-- Tombol Arah (Kiri / Kanan) -->
        <div class="flex space-x-3">
            <button id="btnLeft" class="touch-btn w-16 h-16 md:w-20 md:h-20 bg-slate-800/90 border-2 border-slate-600/80 text-cyan-400 text-3xl font-bold rounded-2xl shadow-2xl flex justify-center items-center active:bg-cyan-600 active:text-white backdrop-blur">
                ◄
            </button>
            <button id="btnRight" class="touch-btn w-16 h-16 md:w-20 md:h-20 bg-slate-800/90 border-2 border-slate-600/80 text-cyan-400 text-3xl font-bold rounded-2xl shadow-2xl flex justify-center items-center active:bg-cyan-600 active:text-white backdrop-blur">
                ►
            </button>
        </div>

        <!-- Tombol Melompat -->
        <div>
            <button id="btnJump" class="touch-btn w-20 h-20 md:w-24 md:h-24 bg-gradient-to-tr from-red-600 to-rose-500 border-2 border-rose-300/60 text-white text-lg md:text-xl font-black rounded-full shadow-2xl shadow-red-600/40 flex justify-center items-center active:bg-red-700 uppercase tracking-wider backdrop-blur">
                LOMPAT
            </button>
        </div>
    </footer>

    <!-- Logika Game JavaScript -->
    <script>
        // Setup Canvas & Context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Elemen UI
        const stageText = document.getElementById('stageText');
        const scoreText = document.getElementById('scoreText');
        const coinsText = document.getElementById('coinsText');
        const livesText = document.getElementById('livesText');
        const overlayScreen = document.getElementById('overlayScreen');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const overlayIcon = document.getElementById('overlayIcon');
        const startBtn = document.getElementById('startBtn');
        const audioToggle = document.getElementById('audioToggle');

        // Sistem Efek Suara (Web Audio API)
        let soundEnabled = true;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(650, now + 0.15);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(987.77, now);
                    osc.frequency.setValueAtTime(1318.51, now + 0.08);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'stomp') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.12);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'block') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.setValueAtTime(120, now + 0.06);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.5);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'win') {
                    const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
                    notes.forEach((freq, idx) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.type = 'triangle';
                        noteOsc.frequency.value = freq;
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        const start = now + idx * 0.10;
                        noteGain.gain.setValueAtTime(0.18, start);
                        noteGain.gain.linearRampToValueAtTime(0.01, start + 0.22);
                        noteOsc.start(start);
                        noteOsc.stop(start + 0.22);
                    });
                }
            } catch(e) { console.error(e); }
        }

        audioToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            audioToggle.innerText = soundEnabled ? '🔊 Suara' : '🔇 Mute';
        });

        // Input Keyboard
        const keys = { left: false, right: false, jump: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
                if (!keys.jump && player.grounded) {
                    player.vy = -player.jumpStrength;
                    player.grounded = false;
                    playSound('jump');
                }
                keys.jump = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.jump = false;
        });

        // Kontrol Sentuh Mobile
        const bindTouch = (id, keyName) => {
            const btn = document.getElementById(id);
            const start = (e) => {
                e.preventDefault();
                initAudio();
                if (keyName === 'jump') {
                    if (!keys.jump && player.grounded) {
                        player.vy = -player.jumpStrength;
                        player.grounded = false;
                        playSound('jump');
                    }
                }
                keys[keyName] = true;
            };
            const end = (e) => {
                e.preventDefault();
                keys[keyName] = false;
            };
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        };

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnJump', 'jump');

        // Parameter Utama Game & Multi Stage
        const GRAVITY = 0.52;
        const MAX_STAGES = 3;
        let currentStage = 1;

        let cameraX = 0;
        let gameScore = 0;
        let coinsCollected = 0;
        let lives = 3;
        let isGameStateRunning = false;
        let overlayState = 'START'; // 'START', 'STAGE_CLEAR', 'WIN', 'GAME_OVER'
        let globalTick = 0;

        // Player (Mario HD)
        const player = {
            x: 80,
            y: 200,
            width: 32,
            height: 44,
            vx: 0,
            vy: 0,
            speed: 4.8,
            jumpStrength: 12.8,
            grounded: false,
            facingLeft: false,
            animFrame: 0,
            animTimer: 0
        };

        // Level Elements
        let platforms = [];
        let coins = [];
        let enemies = [];
        let particles = [];
        let flag = { x: 2650, y: 130, width: 24, height: 230, reached: false };
        let stars = [];

        // Inisialisasi Bintang Latar Belakang
        for (let i = 0; i < 70; i++) {
            stars.push({
                x: Math.random() * 3600,
                y: Math.random() * 220,
                size: Math.random() * 2 + 1,
                alpha: Math.random()
            });
        }

        // Generasi Level Berdasarkan Stage (Multi Stage System)
        function buildLevel(stage) {
            platforms = [];
            coins = [];
            enemies = [];
            particles = [];

            if (stage === 1) {
                // STAGE 1: Malam / Normal
                const groundSegments = [
                    { start: 0, width: 850 },
                    { start: 980, width: 620 },
                    { start: 1700, width: 550 },
                    { start: 2320, width: 750 }
                ];
                groundSegments.forEach(seg => {
                    platforms.push({ x: seg.start, y: 360, width: seg.width, height: 90, type: 'ground' });
                });

                const blockData = [
                    { x: 250, y: 250, type: 'question', item: 'coin' },
                    { x: 290, y: 250, type: 'brick' },
                    { x: 330, y: 250, type: 'question', item: 'coin' },
                    { x: 370, y: 250, type: 'brick' },
                    { x: 330, y: 150, type: 'question', item: 'coin' },
                    { x: 550, y: 290, width: 52, height: 70, type: 'pipe' },
                    { x: 720, y: 250, width: 52, height: 110, type: 'pipe' },
                    { x: 1020, y: 250, type: 'brick' },
                    { x: 1060, y: 250, type: 'question', item: 'coin' },
                    { x: 1100, y: 250, type: 'brick' },
                    { x: 1220, y: 190, type: 'brick' },
                    { x: 1260, y: 190, type: 'question', item: 'coin' },
                    { x: 1300, y: 190, type: 'brick' },
                    { x: 1450, y: 270, width: 52, height: 90, type: 'pipe' },
                    { x: 1600, y: 270, width: 80, height: 22, type: 'platform' },
                    { x: 1750, y: 210, width: 90, height: 22, type: 'platform' },
                    { x: 1920, y: 250, type: 'question', item: 'coin' },
                    { x: 1960, y: 250, type: 'question', item: 'coin' },
                    { x: 2420, y: 320, width: 40, height: 40, type: 'brick' },
                    { x: 2460, y: 280, width: 40, height: 80, type: 'brick' },
                    { x: 2500, y: 240, width: 40, height: 120, type: 'brick' },
                    { x: 2540, y: 200, width: 40, height: 160, type: 'brick' }
                ];
                blockData.forEach(b => platforms.push({ ...b, width: b.width || 40, height: b.height || 40, hit: false, bounce: 0 }));

                const coinPositions = [
                    { x: 250, y: 210 }, { x: 290, y: 210 }, { x: 370, y: 210 },
                    { x: 566, y: 250 }, { x: 736, y: 210 },
                    { x: 1630, y: 230 }, { x: 1780, y: 170 },
                    { x: 2100, y: 310 }, { x: 2140, y: 310 }, { x: 2180, y: 310 }
                ];
                coinPositions.forEach(c => coins.push({ x: c.x, y: c.y, width: 20, height: 24, collected: false, floatOffset: Math.random() * Math.PI }));

                enemies = [
                    { x: 460, y: 328, width: 32, height: 32, vx: -1.3, alive: true, animTick: 0 },
                    { x: 860, y: 328, width: 32, height: 32, vx: -1.3, alive: true, animTick: 0 },
                    { x: 1150, y: 328, width: 32, height: 32, vx: 1.3, alive: true, animTick: 0 },
                    { x: 1800, y: 328, width: 32, height: 32, vx: -1.5, alive: true, animTick: 0 },
                    { x: 2220, y: 328, width: 32, height: 32, vx: -1.5, alive: true, animTick: 0 }
                ];
                flag = { x: 2650, y: 130, width: 24, height: 230, reached: false };

            } else if (stage === 2) {
                // STAGE 2: Senja / Tembok Rintangan & Musuh Lebih Cepat
                const groundSegments = [
                    { start: 0, width: 700 },
                    { start: 820, width: 500 },
                    { start: 1440, width: 600 },
                    { start: 2160, width: 450 },
                    { start: 2700, width: 700 }
                ];
                groundSegments.forEach(seg => {
                    platforms.push({ x: seg.start, y: 360, width: seg.width, height: 90, type: 'ground' });
                });

                const blockData = [
                    { x: 200, y: 260, type: 'question', item: 'coin' },
                    { x: 240, y: 260, type: 'question', item: 'coin' },
                    { x: 400, y: 280, width: 52, height: 80, type: 'pipe' },
                    { x: 550, y: 220, type: 'brick' },
                    { x: 590, y: 220, type: 'question', item: 'coin' },
                    { x: 730, y: 280, width: 80, height: 20, type: 'platform' },
                    { x: 860, y: 210, width: 90, height: 20, type: 'platform' },
                    { x: 1000, y: 250, type: 'brick' },
                    { x: 1040, y: 250, type: 'brick' },
                    { x: 1080, y: 250, type: 'question', item: 'coin' },
                    { x: 1250, y: 270, width: 52, height: 90, type: 'pipe' },
                    { x: 1500, y: 260, type: 'question', item: 'coin' },
                    { x: 1650, y: 200, width: 100, height: 20, type: 'platform' },
                    { x: 1850, y: 240, width: 80, height: 20, type: 'platform' },
                    { x: 2040, y: 270, width: 52, height: 90, type: 'pipe' },
                    { x: 2250, y: 230, width: 80, height: 20, type: 'platform' },
                    { x: 2450, y: 190, width: 80, height: 20, type: 'platform' },
                    // Tangga akhir Stage 2
                    { x: 2800, y: 320, width: 40, height: 40, type: 'brick' },
                    { x: 2840, y: 280, width: 40, height: 80, type: 'brick' },
                    { x: 2880, y: 240, width: 40, height: 120, type: 'brick' },
                    { x: 2920, y: 200, width: 40, height: 160, type: 'brick' }
                ];
                blockData.forEach(b => platforms.push({ ...b, width: b.width || 40, height: b.height || 40, hit: false, bounce: 0 }));

                const coinPositions = [
                    { x: 200, y: 220 }, { x: 240, y: 220 }, { x: 750, y: 240 },
                    { x: 880, y: 170 }, { x: 1680, y: 160 }, { x: 1870, y: 200 },
                    { x: 2270, y: 190 }, { x: 2470, y: 150 }
                ];
                coinPositions.forEach(c => coins.push({ x: c.x, y: c.y, width: 20, height: 24, collected: false, floatOffset: Math.random() * Math.PI }));

                enemies = [
                    { x: 350, y: 328, width: 32, height: 32, vx: -1.8, alive: true, animTick: 0 },
                    { x: 600, y: 328, width: 32, height: 32, vx: -1.8, alive: true, animTick: 0 },
                    { x: 920, y: 328, width: 32, height: 32, vx: 1.8, alive: true, animTick: 0 },
                    { x: 1550, y: 328, width: 32, height: 32, vx: -2.0, alive: true, animTick: 0 },
                    { x: 1800, y: 328, width: 32, height: 32, vx: 2.0, alive: true, animTick: 0 },
                    { x: 2300, y: 328, width: 32, height: 32, vx: -2.0, alive: true, animTick: 0 }
                ];
                flag = { x: 3020, y: 130, width: 24, height: 230, reached: false };

            } else if (stage === 3) {
                // STAGE 3: Gunung Berapi / Lava Zone / Paling Sukar
                const groundSegments = [
                    { start: 0, width: 600 },
                    { start: 720, width: 450 },
                    { start: 1280, width: 500 },
                    { start: 1900, width: 400 },
                    { start: 2420, width: 800 }
                ];
                groundSegments.forEach(seg => {
                    platforms.push({ x: seg.start, y: 360, width: seg.width, height: 90, type: 'ground' });
                });

                const blockData = [
                    { x: 180, y: 250, type: 'question', item: 'coin' },
                    { x: 220, y: 250, type: 'brick' },
                    { x: 260, y: 250, type: 'question', item: 'coin' },
                    { x: 420, y: 270, width: 52, height: 90, type: 'pipe' },
                    { x: 620, y: 240, width: 80, height: 20, type: 'platform' },
                    { x: 800, y: 210, width: 80, height: 20, type: 'platform' },
                    { x: 980, y: 260, type: 'question', item: 'coin' },
                    { x: 1020, y: 260, type: 'question', item: 'coin' },
                    { x: 1180, y: 210, width: 90, height: 20, type: 'platform' },
                    { x: 1380, y: 270, width: 52, height: 90, type: 'pipe' },
                    { x: 1550, y: 220, type: 'brick' },
                    { x: 1590, y: 220, type: 'question', item: 'coin' },
                    { x: 1630, y: 220, type: 'brick' },
                    { x: 1800, y: 230, width: 80, height: 20, type: 'platform' },
                    { x: 2000, y: 190, width: 80, height: 20, type: 'platform' },
                    { x: 2200, y: 230, width: 80, height: 20, type: 'platform' },
                    { x: 2520, y: 320, width: 40, height: 40, type: 'brick' },
                    { x: 2560, y: 280, width: 40, height: 80, type: 'brick' },
                    { x: 2600, y: 240, width: 40, height: 120, type: 'brick' },
                    { x: 2640, y: 200, width: 40, height: 160, type: 'brick' }
                ];
                blockData.forEach(b => platforms.push({ ...b, width: b.width || 40, height: b.height || 40, hit: false, bounce: 0 }));

                const coinPositions = [
                    { x: 180, y: 210 }, { x: 260, y: 210 }, { x: 640, y: 200 },
                    { x: 820, y: 170 }, { x: 1200, y: 170 }, { x: 1590, y: 180 },
                    { x: 1820, y: 190 }, { x: 2020, y: 150 }, { x: 2220, y: 190 }
                ];
                coinPositions.forEach(c => coins.push({ x: c.x, y: c.y, width: 20, height: 24, collected: false, floatOffset: Math.random() * Math.PI }));

                enemies = [
                    { x: 300, y: 328, width: 32, height: 32, vx: -2.2, alive: true, animTick: 0 },
                    { x: 500, y: 328, width: 32, height: 32, vx: 2.2, alive: true, animTick: 0 },
                    { x: 820, y: 328, width: 32, height: 32, vx: -2.3, alive: true, animTick: 0 },
                    { x: 1400, y: 328, width: 32, height: 32, vx: -2.5, alive: true, animTick: 0 },
                    { x: 2000, y: 328, width: 32, height: 32, vx: 2.5, alive: true, animTick: 0 },
                    { x: 2480, y: 328, width: 32, height: 32, vx: -2.5, alive: true, animTick: 0 }
                ];
                flag = { x: 2750, y: 130, width: 24, height: 230, reached: false };
            }
        }

        function resetPlayer() {
            player.x = 80;
            player.y = 200;
            player.vx = 0;
            player.vy = 0;
            player.grounded = false;
        }

        // Tambah Partikel HD
        function addParticles(x, y, color, count = 10, isSparkle = false) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * (isSparkle ? 8 : 6),
                    vy: (Math.random() - 0.5) * (isSparkle ? 8 : 6) - (isSparkle ? 0 : 2),
                    size: Math.random() * (isSparkle ? 4 : 6) + 2,
                    color: color,
                    life: 25 + Math.random() * 10,
                    maxLife: 35
                });
            }
        }

        // Pembaruan Logika Utama Game
        function update() {
            if (!isGameStateRunning) return;
            globalTick++;

            // Input Bergerak
            if (keys.left) {
                player.vx = -player.speed;
                player.facingLeft = true;
            } else if (keys.right) {
                player.vx = player.speed;
                player.facingLeft = false;
            } else {
                player.vx *= 0.78;
            }

            player.vy += GRAVITY;
            player.grounded = false;

            // Gerak Horizontal & Deteksi Tabrakan
            player.x += player.vx;
            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vx > 0) player.x = p.x - player.width;
                    else if (player.vx < 0) player.x = p.x + p.width;
                }
            }

            // Gerak Vertikal & Deteksi Tabrakan
            player.y += player.vy;
            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vy > 0) { // Menapak
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    } else if (player.vy < 0) { // Menyundul
                        player.y = p.y + p.height;
                        player.vy = 0;

                        p.bounce = 8; // Efek animasi membal

                        if (p.type === 'question' && !p.hit) {
                            p.hit = true;
                            coinsCollected++;
                            gameScore += 200;
                            playSound('coin');
                            addParticles(p.x + p.width / 2, p.y, '#fde047', 12, true);
                        } else if (p.type === 'brick') {
                            playSound('block');
                            addParticles(p.x + p.width / 2, p.y + p.height / 2, '#d97706', 12);
                        }
                    }
                }

                // Pengurangan Efek Membal
                if (p.bounce > 0) p.bounce -= 1;
            }

            // Batas Kiri Peta
            if (player.x < 0) player.x = 0;

            // Smooth Camera Follow HD
            const targetCamX = player.x - 260;
            cameraX += (targetCamX - cameraX) * 0.1;
            if (cameraX < 0) cameraX = 0;

            // Jatuh Jurang
            if (player.y > canvas.height + 80) {
                handlePlayerDeath();
            }

            // Logika Koin HD
            coins.forEach(c => {
                if (!c.collected && checkCollision(player, c)) {
                    c.collected = true;
                    coinsCollected++;
                    gameScore += 100;
                    playSound('coin');
                    addParticles(c.x + 10, c.y + 12, '#fde047', 10, true);
                }
            });

            // Logika Musuh HD
            enemies.forEach(e => {
                if (!e.alive) return;

                e.x += e.vx;
                e.animTick++;

                platforms.forEach(p => {
                    if (checkCollision(e, p)) {
                        e.vx *= -1;
                        e.x += e.vx;
                    }
                });

                if (checkCollision(player, e)) {
                    // Stomp (Injak Kepala)
                    if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 14) {
                        e.alive = false;
                        player.vy = -8.5;
                        gameScore += 300;
                        playSound('stomp');
                        addParticles(e.x + e.width / 2, e.y + e.height / 2, '#92400e', 12);
                    } else {
                        handlePlayerDeath();
                    }
                }
            });

            // Logika Bendera (Mencapai Finish)
            if (!flag.reached && checkCollision(player, flag)) {
                flag.reached = true;
                gameScore += 1000 + lives * 300;
                playSound('win');
                addParticles(flag.x + 10, flag.y + 20, '#f43f5e', 25, true);

                setTimeout(() => {
                    if (currentStage < MAX_STAGES) {
                        showStageCompleteOverlay();
                    } else {
                        endGame(true);
                    }
                }, 900);
            }

            // Update Partikel
            particles.forEach((part, index) => {
                part.x += part.vx;
                part.y += part.vy;
                part.life--;
                if (part.life <= 0) particles.splice(index, 1);
            });

            // Animasi Lari Mario
            if (Math.abs(player.vx) > 0.5) {
                player.animTimer++;
                if (player.animTimer % 5 === 0) {
                    player.animFrame = (player.animFrame + 1) % 4;
                }
            } else {
                player.animFrame = 0;
            }

            // Update Header UI
            stageText.innerText = `STAGE: ${currentStage}/${MAX_STAGES}`;
            scoreText.innerText = `SKOR: ${gameScore}`;
            coinsText.innerText = `KOIN: ${coinsCollected}`;
            livesText.innerText = `x ${lives}`;
        }

        function handlePlayerDeath() {
            lives--;
            playSound('gameover');
            if (lives <= 0) {
                endGame(false);
            } else {
                resetPlayer();
            }
        }

        function checkCollision(r1, r2) {
            return (
                r1.x < r2.x + r2.width &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.height &&
                r1.y + r1.height > r2.y
            );
        }

        // ===== RENDERING GRAFIS HD =====
        function render() {
            // Gradien Langit Berdasarkan Stage
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (currentStage === 1) {
                // Stage 1: Malam Biru Indigo
                bgGradient.addColorStop(0, '#0f172a');
                bgGradient.addColorStop(0.5, '#1e1b4b');
                bgGradient.addColorStop(1, '#312e81');
            } else if (currentStage === 2) {
                // Stage 2: Senja Jingga Sunset
                bgGradient.addColorStop(0, '#451a03');
                bgGradient.addColorStop(0.5, '#9a3412');
                bgGradient.addColorStop(1, '#ea580c');
            } else {
                // Stage 3: Gunung Berapi Lava Dark Zone
                bgGradient.addColorStop(0, '#18181b');
                bgGradient.addColorStop(0.5, '#450a0a');
                bgGradient.addColorStop(1, '#7f1d1d');
            }
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bintang Gemerlap HD
            stars.forEach(s => {
                const alpha = Math.sin(globalTick * 0.05 + s.alpha * 10) * 0.4 + 0.6;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fillRect(s.x - cameraX * 0.2, s.y, s.size, s.size);
            });

            ctx.save();
            ctx.translate(-Math.floor(cameraX), 0);

            // Pegunungan Latar Parallax HD
            drawHills();

            // Awan Parallax HD
            drawClouds();

            // Efek Gelombang Lava di Bagian Bawah untuk Stage 3
            if (currentStage === 3) {
                ctx.fillStyle = '#ef4444';
                for (let xL = 0; xL < 3500; xL += 40) {
                    const lavaY = 410 + Math.sin(globalTick * 0.1 + xL) * 6;
                    ctx.fillRect(xL, lavaY, 40, 40);
                }
            }

            // Render Platform & Blok HD
            platforms.forEach(p => {
                const drawY = p.y - (p.bounce || 0);

                if (p.type === 'ground') {
                    // Rumput Atas Gradien HD
                    const grassGrad = ctx.createLinearGradient(p.x, drawY, p.x, drawY + 18);
                    if (currentStage === 3) {
                        grassGrad.addColorStop(0, '#f97316');
                        grassGrad.addColorStop(1, '#b91c1c');
                    } else {
                        grassGrad.addColorStop(0, '#4ade80');
                        grassGrad.addColorStop(1, '#16a34a');
                    }
                    ctx.fillStyle = grassGrad;
                    ctx.fillRect(p.x, drawY, p.width, 18);

                    // Detail Garis Rumput
                    ctx.fillStyle = currentStage === 3 ? '#fed7aa' : '#bbf7d0';
                    for (let xG = p.x + 4; xG < p.x + p.width; xG += 16) {
                        ctx.fillRect(xG, drawY, 3, 6);
                    }

                    // Tanah Cokelat Bertekstur HD
                    const dirtGrad = ctx.createLinearGradient(p.x, drawY + 18, p.x, drawY + p.height);
                    dirtGrad.addColorStop(0, '#92400e');
                    dirtGrad.addColorStop(1, '#451a03');
                    ctx.fillStyle = dirtGrad;
                    ctx.fillRect(p.x, drawY + 18, p.width, p.height - 18);

                    // Pola Tekstur Batuan Tanah
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    for (let xD = p.x + 8; xD < p.x + p.width; xD += 32) {
                        ctx.fillRect(xD, drawY + 28, 12, 10);
                        ctx.fillRect(xD + 16, drawY + 50, 10, 8);
                    }
                } else if (p.type === 'brick') {
                    // Blok Batu Bata HD
                    const brickGrad = ctx.createLinearGradient(p.x, drawY, p.x, drawY + p.height);
                    brickGrad.addColorStop(0, '#d97706');
                    brickGrad.addColorStop(1, '#78350f');
                    ctx.fillStyle = brickGrad;
                    ctx.fillRect(p.x, drawY, p.width, p.height);

                    ctx.strokeStyle = '#451a03';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, drawY, p.width, p.height);

                    // Sekat Garis Semen Bata HD
                    ctx.strokeStyle = '#fef3c7';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(p.x, drawY + 20); ctx.lineTo(p.x + p.width, drawY + 20);
                    ctx.moveTo(p.x + 20, drawY); ctx.lineTo(p.x + 20, drawY + 20);
                    ctx.moveTo(p.x + 10, drawY + 20); ctx.lineTo(p.x + 10, drawY + 40);
                    ctx.stroke();
                } else if (p.type === 'question') {
                    // Blok Question (?) HD
                    const qGrad = ctx.createLinearGradient(p.x, drawY, p.x, drawY + p.height);
                    if (p.hit) {
                        qGrad.addColorStop(0, '#78350f');
                        qGrad.addColorStop(1, '#451a03');
                    } else {
                        qGrad.addColorStop(0, '#fde047');
                        qGrad.addColorStop(0.5, '#eab308');
                        qGrad.addColorStop(1, '#ca8a04');
                    }
                    ctx.fillStyle = qGrad;
                    ctx.fillRect(p.x, drawY, p.width, p.height);

                    ctx.strokeStyle = '#854d0e';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, drawY, p.width, p.height);

                    // Tanda Tanya HD
                    if (!p.hit) {
                        ctx.fillStyle = '#78350f';
                        ctx.font = '900 24px sans-serif';
                        ctx.fillText('?', p.x + 14, drawY + 29);
                        ctx.fillStyle = '#ffffff';
                        ctx.fillText('?', p.x + 12, drawY + 28);
                    }
                } else if (p.type === 'pipe') {
                    // Pipa Hijau HD Berkilau
                    const pipeGrad = ctx.createLinearGradient(p.x, drawY, p.x + p.width, drawY);
                    pipeGrad.addColorStop(0, '#15803d');
                    pipeGrad.addColorStop(0.3, '#4ade80');
                    pipeGrad.addColorStop(0.7, '#22c55e');
                    pipeGrad.addColorStop(1, '#14532d');
                    ctx.fillStyle = pipeGrad;
                    ctx.fillRect(p.x, drawY + 22, p.width, p.height - 22);

                    // Mahkota Pipa Atas
                    ctx.fillRect(p.x - 5, drawY, p.width + 10, 22);
                    ctx.strokeStyle = '#052e16';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x - 5, drawY, p.width + 10, 22);
                    ctx.strokeRect(p.x, drawY + 22, p.width, p.height - 22);
                } else if (p.type === 'platform') {
                    // Platform Melayang HD
                    ctx.fillStyle = '#f97316';
                    ctx.fillRect(p.x, drawY, p.width, p.height);
                    ctx.fillStyle = '#fdba74';
                    ctx.fillRect(p.x, drawY, p.width, 4);
                }
            });

            // Tiang & Bendera Kemenangan HD
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(flag.x + 10, flag.y, 6, flag.height);
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.moveTo(flag.x + 16, flag.y + 10);
            ctx.lineTo(flag.x + 65, flag.y + 35);
            ctx.lineTo(flag.x + 16, flag.y + 60);
            ctx.closePath();
            ctx.fill();
            // Bola Emas Atas Tiang
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(flag.x + 13, flag.y, 10, 0, Math.PI * 2);
            ctx.fill();

            // Koin Emas HD Berputar & Mengkilap
            coins.forEach(c => {
                if (!c.collected) {
                    const floatY = c.y + Math.sin(globalTick * 0.08 + c.floatOffset) * 4;
                    const scaleX = Math.abs(Math.cos(globalTick * 0.08));

                    ctx.save();
                    ctx.translate(c.x + c.width / 2, floatY + c.height / 2);
                    ctx.scale(scaleX, 1);

                    const coinGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 10);
                    coinGrad.addColorStop(0, '#fef08a');
                    coinGrad.addColorStop(0.7, '#eab308');
                    coinGrad.addColorStop(1, '#ca8a04');

                    ctx.fillStyle = coinGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, 10, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#78350f';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.restore();
                }
            });

            // Musuh Goomba HD
            enemies.forEach(e => {
                if (e.alive) {
                    drawGoombaHD(e);
                }
            });

            // Karakter Mario HD
            drawMarioHD();

            // Render Partikel HD
            particles.forEach(part => {
                ctx.fillStyle = part.color;
                ctx.globalAlpha = part.life / part.maxLife;
                ctx.fillRect(part.x, part.y, part.size, part.size);
                ctx.globalAlpha = 1.0;
            });

            ctx.restore();
        }

        // Menggambar Pegunungan Parallax HD
        function drawHills() {
            const hillPositions = [150, 750, 1350, 2000, 2600, 3100];
            hillPositions.forEach(hx => {
                const hillGrad = ctx.createLinearGradient(0, 220, 0, 360);
                if (currentStage === 3) {
                    hillGrad.addColorStop(0, '#7f1d1d');
                    hillGrad.addColorStop(1, '#450a0a');
                } else {
                    hillGrad.addColorStop(0, '#15803d');
                    hillGrad.addColorStop(1, '#064e3b');
                }
                ctx.fillStyle = hillGrad;
                ctx.beginPath();
                ctx.arc(hx, 360, 110, Math.PI, 0);
                ctx.fill();

                // Highlight Pegunungan
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.beginPath();
                ctx.arc(hx - 15, 360, 95, Math.PI, Math.PI * 1.5);
                ctx.fill();
            });
        }

        // Menggambar Awan Parallax HD
        function drawClouds() {
            ctx.fillStyle = currentStage === 3 ? 'rgba(254, 205, 211, 0.5)' : 'rgba(241, 245, 249, 0.75)';
            const cloudPositions = [120, 480, 880, 1280, 1680, 2180, 2580, 3080];
            cloudPositions.forEach(cx => {
                const cy = 70 + Math.sin(cx + globalTick * 0.02) * 5;
                ctx.beginPath();
                ctx.arc(cx, cy, 22, 0, Math.PI * 2);
                ctx.arc(cx + 20, cy - 10, 28, 0, Math.PI * 2);
                ctx.arc(cx + 45, cy, 22, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Desain Visual Goomba HD
        function drawGoombaHD(e) {
            ctx.save();
            ctx.translate(e.x, e.y);

            // Kepala Jamur Cokelat
            const headGrad = ctx.createLinearGradient(0, 0, 0, e.height);
            headGrad.addColorStop(0, '#b45309');
            headGrad.addColorStop(1, '#451a03');
            ctx.fillStyle = headGrad;

            ctx.beginPath();
            ctx.arc(16, 14, 16, Math.PI, 0);
            ctx.fillRect(0, 14, 32, 10);
            ctx.fill();

            // Kaki Berjalan Goomba
            ctx.fillStyle = '#1c1917';
            const legOffset = Math.sin(e.animTick * 0.2) * 3;
            ctx.fillRect(2, 22 + legOffset, 10, 10);
            ctx.fillRect(20, 22 - legOffset, 10, 10);

            // Mata HD & Alis
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(6, 10, 7, 10);
            ctx.fillRect(19, 10, 7, 10);

            ctx.fillStyle = '#000000';
            ctx.fillRect(8, 12, 3, 6);
            ctx.fillRect(19, 12, 3, 6);

            // Alis Galak
            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(4, 8); ctx.lineTo(13, 12);
            ctx.moveTo(28, 8); ctx.lineTo(19, 12);
            ctx.stroke();

            ctx.restore();
        }

        // Desain Visual Karakter Mario HD
        function drawMarioHD() {
            ctx.save();
            if (player.facingLeft) {
                ctx.translate(player.x + player.width, player.y);
                ctx.scale(-1, 1);
            } else {
                ctx.translate(player.x, player.y);
            }

            // Topi Merah HD
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(4, 0, 24, 8);
            ctx.fillRect(8, -2, 18, 6);
            ctx.fillStyle = '#ef4444'; // Highlight Topi
            ctx.fillRect(6, 0, 20, 3);

            // M Wajah / Lambang Topi
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(16, 3, 3.5, 0, Math.PI * 2);
            ctx.fill();

            // Kulit Wajah
            ctx.fillStyle = '#fde047';
            ctx.fillRect(8, 8, 18, 12);

            // Hidung Bulat HD
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(24, 12, 4, 0, Math.PI * 2);
            ctx.fill();

            // Kumis Khas
            ctx.fillStyle = '#1c1917';
            ctx.fillRect(14, 14, 12, 4);

            // Mata
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(18, 9, 3, 4);

            // Baju Merah HD
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(6, 20, 20, 10);

            // Sarung Tangan Putih
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(2, 22, 5, 6);
            ctx.fillRect(25, 22, 5, 6);

            // Celana Overalls Biru HD
            ctx.fillStyle = '#1d4ed8';
            ctx.fillRect(8, 26, 16, 12);

            // Kancing Emas Celana
            ctx.fillStyle = '#facc15';
            ctx.fillRect(10, 28, 3, 3);
            ctx.fillRect(19, 28, 3, 3);

            // Sepatu Cokelat HD
            ctx.fillStyle = '#451a03';
            if (player.grounded && Math.abs(player.vx) > 0.5) {
                if (player.animFrame % 2 === 0) {
                    ctx.fillRect(2, 38, 11, 6);
                    ctx.fillRect(18, 34, 11, 6);
                } else {
                    ctx.fillRect(4, 34, 11, 6);
                    ctx.fillRect(20, 38, 11, 6);
                }
            } else {
                ctx.fillRect(4, 38, 11, 6);
                ctx.fillRect(18, 38, 11, 6);
            }

            ctx.restore();
        }

        // Loop Game Utama
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Sistem Layar Overlay & Alur Permainan
        function showStageCompleteOverlay() {
            isGameStateRunning = false;
            overlayState = 'STAGE_CLEAR';
            overlayScreen.classList.remove('hidden');

            overlayIcon.innerText = "🌟";
            overlayTitle.innerText = `STAGE ${currentStage} SELESAI!`;
            overlaySubtitle.innerHTML = `Hebat! Kamu berhasil menaklukkan Stage ${currentStage}!<br>Skor: <span class="text-yellow-400 font-bold">${gameScore}</span> | Koin: <span class="text-amber-300 font-bold">${coinsCollected}</span><br>Bersiaplah untuk Stage ${currentStage + 1}!`;
            startBtn.innerText = `LANJUT KE STAGE ${currentStage + 1} ▶`;
        }

        function startGame() {
            initAudio();

            if (overlayState === 'START' || overlayState === 'WIN' || overlayState === 'GAME_OVER') {
                currentStage = 1;
                lives = 3;
                gameScore = 0;
                coinsCollected = 0;
            } else if (overlayState === 'STAGE_CLEAR') {
                currentStage++;
            }

            buildLevel(currentStage);
            resetPlayer();
            isGameStateRunning = true;
            overlayScreen.classList.add('hidden');
        }

        function endGame(isWin) {
            isGameStateRunning = false;
            overlayScreen.classList.remove('hidden');

            if (isWin) {
                overlayState = 'WIN';
                overlayIcon.innerText = "🏆";
                overlayTitle.innerText = "SELAMAT! KAMU MENAMATKAN GAME!";
                overlaySubtitle.innerText = `Luar biasa! Kamu telah menyelesaikan semua ${MAX_STAGES} Stage! Total Skor: ${gameScore} | Total Koin: ${coinsCollected}`;
                startBtn.innerText = "MAIN DARI AWAL ↺";
            } else {
                overlayState = 'GAME_OVER';
                overlayIcon.innerText = "💀";
                overlayTitle.innerText = "GAME OVER";
                overlaySubtitle.innerText = `Kamu kehabisan nyawa di Stage ${currentStage}! Skor Akhir: ${gameScore}`;
                startBtn.innerText = "COBA LAGI ↺";
            }
        }

        startBtn.addEventListener('click', startGame);

        // Render Pertama kali
        buildLevel(currentStage);
        render();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
